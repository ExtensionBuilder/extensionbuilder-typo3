<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />

    <f:section name="Content">

        <f:comment>DevelopmentCodeStart</f:comment>
        <f:if condition="{configuration.developmentServer}">
            <f:if condition="{configuration.debug.vendor.list.fluid}">
                <f:debug inline="1">{_all}</f:debug>
            </f:if>
        </f:if>
        <f:comment>DevelopmentCodeEnd</f:comment>

    	<f:if condition="{vendorList -> f:count()} == 0">
        	<f:then>
                <h1><f:translate key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.vendor.xlf:startNow" /></h1>
        	</f:then>
        	<f:else>
                <h1><f:translate key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.vendor.xlf:h1" /></h1>
    			<f:render partial="Vendor/List" arguments="{_all}" />
        	</f:else>
    	</f:if>	

    </f:section>
</html>
