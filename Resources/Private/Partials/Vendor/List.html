<f:comment>ToDo</f:comment>

<div class="tx_extensionbuilder_typo3_module_vendor">
    <div class="panel panel-default overflow-visible">

        <div class="panel-collapse collapse {f:if(condition: '!{vendorGroup.backendVendorGroupCollapsed}', then: 'show')}">
            <div class="table-fit mb-0">
                <table class="table table-striped table-hover Group-table">

                    <thead>
                        <tr class="vendorGroup">
                            <th>
                                <f:translate key="{lllBase}.vendor.xlf:vendorList" />
                                ({vendorList -> f:count()})
                            </th>
                            <th>
                                <f:translate key="{lllBase}.xlf:company" />
                            </th>
                            <th>
                                <f:translate key="{lllBase}.xlf:description" />
                            </th>
                            <th data-sort-method="none"></th>
                        </tr>
                    </thead>

                    <tbody>
                        <f:for each="{vendorList}" as="vendor">
                            <tr class="{vendor.vendorName}" data-id="{vendor.vendorName}" >

                                <td class="nowrap-disabled">
                                    <div class="name">
                                        <f:link.action
                                            action="edit"
                                            controller="Vendor"
                                            arguments="{'vendorName': vendor.vendorName}"
                                        >
                                            <strong>{vendor.vendorName}</strong>
                                        </f:link.action>
                                    </div>
                                </td>

                                <td class="nowrap-disabled">
                                    <div class="text-muted" style="margin-top: 0.5em;">
                                        <f:format.nl2br>{vendor.company}</f:format.nl2br>
                                    </div>
                                </td>

                                <td class="nowrap-disabled">
                                    <div class="text-muted" style="margin-top: 0.5em;">
                                        <f:format.nl2br>{vendor.description}</f:format.nl2br>
                                    </div>
                                </td>

                                <td class="nowrap">
                                    <div class="btn-group" role="group">

                                        <f:comment>Edit</f:comment>
                                        <f:link.action
                                            action="edit"
                                            controller="Vendor"
                                            arguments="{'vendorName': vendor.vendorName}"
                                            class="btn btn-default"
                                            data="{bs-toggle: 'tooltip'}"
                                            title="{f:translate(key:'{lllBase}.xlf:edit')}"
                                        >
                                            <core:icon identifier="actions-open" />
                                        </f:link.action>

                                        <f:comment>Duplicate</f:comment>

                                        <f:comment>Rename</f:comment>

                                        <f:comment>Delete</f:comment>
                                        <f:link.action
                                            action="delete"
                                            controller="Vendor"
                                            arguments="{'vendorName': vendor.vendorName}"
                                            class="btn btn-default t3js-modal-trigger"
                                            data="{
                                                bs-toggle: 'tooltip',
                                                severity: 'warning',
                                                button-close-text: '{f:translate(key: \'{lllBase}.xlf:cancel\')}',
                                                bs-content='{f:translate(key: \'{lllBase}.xlf:msg.delete\')}'
                                            }"
                                            title="{f:translate(key:'{lllBase}.xlf:delete')}"
                                        >
                                            <core:icon identifier="actions-edit-delete" />
                                        </f:link.action>

                                    </div>
                                </td>

                            </tr>
                        </f:for>

                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
