<div class="table-fit">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>
                    <f:translate key="{lllBase}.project.xlf:projectExtensionsDependencies" />
                    ({project.dependencies -> f:count()})
                </th>

                <th data-sort-method="none"></th>                     
            </tr>
        </thead>

        <tbody>
            <f:for each="{project.dependencies}" as="dependencieData">
                <tr>
                    <td class="nowrap-disabled">
                        <div class="name">
                            <strong>
                                {dependencieData.extensionName} 
                                <f:if condition="{dependencieData.extension.title} != ''">
                                    ({dependencieData.extension.title})
                                </f:if>
                            </strong>
                        </div>
                        <f:if condition="{projectData.extension.description} != ''">
                            <div class="text-muted eb-margin-top-half">
                                <f:format.nl2br>{dependencieData.extension.description}</f:format.nl2br>
                            </div>
                        </f:if>
                    </td>
                                    
                    <f:comment>Control block</f:comment>
                    <td class="col-control align-top">
                        <div class="btn-group" role="group">
                        </div>
                    </td>
                </tr>
            </f:for>
        </tbody>
    </table>
</div>
