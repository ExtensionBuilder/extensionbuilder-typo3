<div class="tx_extensionbuilder_mod1_configuration">
    <div class="panel panel-default overflow-visible">

        <div class="btn-toolbar panel-heading">

            <f:alias
                map="{add: {
                    command: 'Command',
                }}"
            >

<f:comment>
                    viewHelper: 'ViewHelper',
                    plugin: 'Plugin',
                    scheduler: 'Scheduler',
                    command: 'Command',
                    eventListener: 'Event listener',
                    backendModul: 'Backend module',
                    backendRoute: 'Backend route',
                    contentElement: 'Content Element',
                    enumeration: 'Enumeration'
                    table: 'Table',
</f:comment>

                <f:for each="{add}" as="wert" key="key">
                    <f:link.action
                        action="add"
                        controller="{key}"
                        arguments="{'vendorName': vendorName, 'extensionName': extensionName}"
                        class="btn btn-default"
                        data="{bs-toggle: 'tooltip'}"
                        title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:editextension')}"
                    >
                        {wert}
                    </f:link.action>
                </f:for>
            </f:alias>

        </div>
    </div>
</div>
