<div class="panel panel-default">
    <div class="panel-heading">
        <div class="panel-heading-row eb-list-card-header-row">
            <div class="panel-title">
                <button
                    type="button"
                    class="btn btn-link fw-bold p-0 eb-card-header-title-button"
                    data-bs-toggle="collapse"
                    data-bs-target="#group-{groupId}"
                    aria-expanded="{f:if(condition: collapsed, then: 'false', else: 'true')}"
                >
                    <span>
                        {headline} {headlineData}
                    </span>
                </button>
            </div>

            <div class="panel-actions">
                <button
                    type="button"
                    class="btn btn-outline-secondary btn-sm eb-toggle-table eb-card-header-toggle-button"
                    data-bs-toggle="collapse"
                    data-bs-target="#group-{groupId}"
                    aria-expanded="{f:if(condition: collapsed, then: 'false', else: 'true')}"
                >
                    <span class="collapseIcon">
                        <core:icon
                            identifier="{f:if(condition: collapsed, then: 'actions-view-list-expand', else: 'actions-view-list-collapse')}"
                            size="small"
                        />
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div
        id="group-{groupId}"
        class="panel-collapse collapse {f:if(condition: '!{collapsed}', then: 'show')}"
        data-table="group-{groupId}"
    >
        <div class="table-fit">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>
                            <f:translate key="{lllBase}.extension.xlf:extension" />
                            <span class="t3js-table-total-items">
                                ({extensions -> f:count()})
                            </span>
                        </th>
                        <th>
                            <f:translate key="{lllBase}.extension.xlf:info" />
                        </th>
<f:comment>
                        <th>
                            <f:translate key="{lllBase}.extension.xlf:lastBuild" />
                        </th>
</f:comment>
<f:comment>
                        <th>
                            <f:translate key="{lllBase}.extension.xlf:lastUpload" />
                        </th>
</f:comment>
                        <th data-sort-method="none"></th>
                    </tr>
                </thead>

                <tbody>
                    <f:for
                        each="{extensions}"
                        as="extensionAs"
                    >
                        <tr class="{f:if(condition:'{extension.configuration.extensionBuild}', then: 'disabled')} group_{groupId}">

                            <f:comment>Extension name</f:comment>
                            <td class="nowrap-disabled eb-width-300">
                                <div class="name">
                                    <f:link.action
                                        action="edit"
                                        controller="Extension"
                                        arguments="{
                                            'vendorName': extensionAs.extension.vendorName,
                                            'extensionName': extensionAs.extension.extensionNamespace
                                        }"
				                    >
                                        <strong>
                                            {extensionAs.extension.extensionNamespace} 
                                            <f:if condition="{extensionAs.extension.title} != ''">
                                                ({extensionAs.extension.title})
                                            </f:if>
                                        </strong>
                                    </f:link.action>
                                </div>

                                <f:if condition="{extensionAs.extension.description} != ''">
                                    <div class="text-muted eb-margin-top-half">
                                        <f:format.nl2br>{extensionAs.extension.description}</f:format.nl2br>
                                    </div>
                                </f:if>
                            </td>

                            <f:comment>Info</f:comment>
                            <td>
Info
<f:comment> ToDo
                                <f:for
                                    each="{extensionAs.extension.keywords}"
                                    as="keyword"
                                >
                                    <span class="badge badge-{label.class}" title="{label.description}">{keyword}</span>
                                </f:for>
</f:comment>
                            </td>

                            <f:comment>Last build</f:comment>
<f:comment>
                            <td class="eb-width-200">
                                <f:if condition="{extensionAs.extensionBuild.lastBuild}">
                                     <f:then>
                                        <span class="badge badge-{label.class}" title="{label.description}">
                                            <f:format.date
                                                format="d.m.Y - H:i:s"
                                                date="{extensionAs.extensionBuild.lastBuild}"
                                            />
                                        </span>
                                    </f:then>
                                    <f:else>
                                        <span class="badge badge-{label.class}" title="{label.description}">No build</span>
                                    </f:else>
                                </f:if>
                            </td>
</f:comment>

                            <f:comment>Last upload</f:comment>
<f:comment>								
                            <td class="eb-width-200">
                                <f:if condition="{extensionAs.extensionBuild.lastUpload}">
                                    <f:then>
                                        <span class="badge badge-{label.class}" title="{label.description}">
                                            <f:format.date
                                                format="d.m.Y - H:i:s"
                                                date="{extensionAs.extensionBuild.lastBuild}"
                                            />
                                        </span>
                                    </f:then>
                                    <f:else>
                                        <span class="badge badge-{label.class}" title="{label.description}">No upload</span>
                                    </f:else>
                                </f:if>
                            </td>
</f:comment>
		
                            <f:comment>Control block</f:comment>
                            <td class="col-control align-top">
                                <div class="btn-group" role="group">
                                    <f:comment>Edit</f:comment>
                                    <f:link.action
                                        action="edit"
                                        controller="Extension"
                                        class="btn btn-default"
                                        arguments="{
                                            'vendorName': extensionAs.extension.vendorName,
                                            'extensionName': extensionAs.extension.extensionNamespace
                                        }"
                                        data="{bs-toggle: 'tooltip'}"
                                        title="{f:translate(key:'{lllBase}.xlf:edit')}"
                                    >
                                        <core:icon identifier="actions-open" />
                                    </f:link.action>

                                    <f:comment>Delete</f:comment>
                                    <f:if condition="{extensionAs.extension.noDelete} != true">
                                        <f:then>
                                            <f:link.action
                                                action="delete"
                                                controller="Extension"
                                                class="btn btn-default t3js-modal-trigger eb-margin-left-5"
                                                arguments="{
                                                    'vendorName': extensionAs.extension.vendorName,
                                                    'extensionName': extensionAs.extension.extensionNamespace
                                                }"
                                                data="{
                                                    bs-toggle: 'tooltip',
                                                    severity: 'warning',
                                                    button-close-text: '{f:translate(key: \'{lllBase}.xlf:cancel\')}',
                                                    bs-content='{f:translate(key: \'{lllBase}.xlf:msg.delete\')}'
                                                }"
                                                title="{f:translate(key:'{lllBase}.xlf:delete')}"
                                            >
                                                <core:icon identifier="actions-edit-delete" />
                                            </f:link.action>
                                        </f:then>
                                        <f:else>
                                            <f:link.action
                                                action="delete"
                                                controller="Extension"
                                                class="btn btn-default t3js-modal-trigger eb-margin-left-5"
                                                arguments="{
                                                    'vendorName': extensionAs.extension.vendorName,
                                                    'extensionName': extensionAs.extension.extensionNamespace
                                                }"
                                                additionalAttributes="{disabled: 'true'}"
                                                data="{
                                                    bs-toggle: 'tooltip',
                                                    severity: 'warning',
                                                    button-close-text: '{f:translate(key: \'{lllBase}.xlf:cancel\')}',
                                                    bs-content='{f:translate(key: \'{lllBase}.xlf:msg.delete\')}'
                                                }"
                                                title="{f:translate(key:'{lllBase}.xlf:delete')}"
                                            >
                                                <core:icon identifier="actions-edit-delete" />
                                            </f:link.action>
                                        </f:else>
                                    </f:if>
                                </div>

                                <f:comment>Build</f:comment>
                                <f:if condition="{extensionAs.extension.noBuild} != true">
                                    <div class="btn-group" role="group">
                                        <f:link.action
                                            action="listBuild"
                                            controller="Extension"
                                            class="btn btn-default"
                                            arguments="{
                                                'vendorName': extensionAs.extension.vendorName,
                                                'extensionName': extensionAs.extension.extensionNamespace
                                            }"
                                            data="{bs-toggle: 'tooltip'}"
                                            title="{f:translate(key:'{lllBase}.xlf:build')}"
                                        >
                                            <core:icon identifier="actions-play" />
                                        </f:link.action>
                                    </div>
                                </f:if>

                                <f:comment>ExtensionInfo</f:comment>

                                <div class="btn-group" role="group">
                                    <f:link.action
                                        action="info"
                                        controller="ExtensionInfo"
                                        class="btn btn-default"
                                        arguments="{
                                            'vendorName': extensionAs.extension.vendorName,
                                            'extensionName': extensionAs.extension.extensionNamespace
                                        }"
                                        data="{bs-toggle: 'tooltip'}"
                                        title="ExtensionInfo"
                                    >
                                        <core:icon identifier="actions-document-view" />
                                    </f:link.action>
                                </div>

<f:comment>
                                <f:comment>Upload</f:comment>
                                <f:if condition="{extensionAs.extension.noUpload} != true">
                                    <div class="btn-group" role="group">
                                        <f:link.action
                                            action="upload"
                                            controller="Extension"
                                            class="btn btn-default"
                                            arguments="{
                                                'vendorName': extensionAs.extension.vendorName,
                                                'extensionName': extensionAs.extension.extensionNamespace
                                            }"
                                            data="{bs-toggle: 'tooltip'}"
                                            title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:upload')}"
                                        >
                                            <core:icon identifier="actions-database-import" />
                                        </f:link.action>
                                    </div>
                                </f:if>
</f:comment>
                            </td>
                        </tr>
                    </f:for>

                </tbody>
            </table>

        </div>
    </div>
</div>
