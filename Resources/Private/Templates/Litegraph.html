<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />
    <f:section name="Content">
        <f:asset.css
            identifier="litegraph"
            href="EXT:extensionbuilder_typo3/Resources/Public/Css/litegraph.css"
        />

        <div
            id="graph-container"
            class="litegraph-container"
            data-extension="{extension}"
            data-components="{components}">


<f:comment>
            <button id="buildExtension" class="eb-build-extension-button">Build Extension</button>
</f:comment>

        </div>

    </f:section>
</html>
