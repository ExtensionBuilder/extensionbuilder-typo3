<f:comment>ToDo</f:comment>

<div class="tx_t3_extensionbulder_module_table">
    <div class="panel panel-default overflow-visible">
        <div class="panel-heading">

            <button
                type="button"
                class="btn btn-link fw-bold pt-1 p-0"
                data-bs-toggle="collapse"
                data-bs-target="#extension-group-{groupId}"
                aria-expanded="{f:if(condition: collapsed{groupId}, then: 'false', else: 'true')}"
            >
                <span>
                    {vendorName}
                </span> 
            </button>

            <button
                type="button"
                class="btn btn-default btn-sm float-end t3js-toggle-table"
                data-bs-toggle="collapse"
                data-bs-target="#extension-group-{groupId}"
                aria-expanded="{f:if(condition: collapsed{groupId}, then: 'false', else: 'true')}"
            >
                <span class="collapseIcon">
                    <core:icon
                        identifier="{f:if(condition: collapsed, then: 'actions-view-list-expand', else: 'actions-view-list-collapse')}"
                        size="small"
                    />
                </span>
            </button>
        </div>

        <div
            class="panel-collapse collapse {f:if(condition: '!{collapsed}', then: 'show')}"
            id="extension-group-{groupId}"
            data-table="extension-group-{groupId}"
        >
            <div class="table-fit mb-0">
						
                <table class="table table-striped table-hover Group-table">
                    <thead>
                        <tr class="group_{groupId}">
                            <th>
                                <f:translate key="{lllBase}.extension.xlf:extension" />
                                <span class="t3js-table-total-items">
                                    ({extensions -> f:count()})
                                </span>
                            </th>
                            <th>
                                <f:translate key="{lllBase}.extension.xlf:info" />
                            </th>
                            <th>
                                <f:translate key="{lllBase}.extension.xlf:lastBuild" />
                            </th>
                            <th>
                                <f:translate key="{lllBase}.extension.xlf:lastUpload" />
                            </th>
                            <th data-sort-method="none"></th>
                        </tr>
                    </thead>

                    <tbody data-multi-record-selection-row-selection="true">
                        <f:for each="{extensions}" as="extensionData">

                            <tr class="{f:if(condition:'{extension.configuration.extensionBuild}', then: 'disabled')} group_{groupId}">
                                <td class="nowrap-disabled">
                                    <div class="name">
                                        <f:link.action
                                            action="edit"
                                            controller="Extension"
                                            arguments="{
                                                'vendorName': extensionData.extension.vendorName,
                                                'extensionName': extensionData.extension.extensionName
                                            }"
				                        >
                                            <strong>
                                                {extensionData.extension.extensionName} 
                                                <f:if condition="{extensionData.extension.title} != ''">
                                                    ({extensionData.extension.title})
                                                </f:if>
                                            </strong>
                                        </f:link.action>
                                    </div>

                                    <f:if condition="{extensionData.extension.description} != ''">
                                        <div class="text-muted" style="margin-top: 0.5em;">
                                            <f:format.nl2br>{extensionData.extension.description}</f:format.nl2br>
                                        </div>
                                    </f:if>
                                </td>

                                <f:comment>Info</f:comment>
                                <td>
                                    <f:for each="{extensionData.extension.keywords}" as="keyword">
                                        <span class="badge badge-{label.class}" title="{label.description}">{keyword}</span>
                                    </f:for>
                                </td>

                                <f:comment>Last build</f:comment>
                                <td>
                                    <f:if condition="{extensionData.extensionBuild.lastBuild}">
                                        <f:then>
                                            <span class="badge badge-{label.class}" title="{label.description}">
                                                <f:format.date
                                                    format="d.m.Y - H:i:s"
                                                    date="{extensionData.extensionBuild.lastBuild}"
                                                />
                                            </span>
                                        </f:then>
                                        <f:else>
                                            <span class="badge badge-{label.class}" title="{label.description}">No build</span>
                                        </f:else>
                                    </f:if>
                                </td>

                                <f:comment>Last upload</f:comment>									
                                <td>
                                    <f:if condition="{extensionData.extensionBuild.lastUpload}">
                                        <f:then>
                                            <span class="badge badge-{label.class}" title="{label.description}">
                                                <f:format.date
                                                    format="d.m.Y - H:i:s"
                                                    date="{extensionData.extensionBuild.lastBuild}"
                                                />
                                            </span>
                                        </f:then>
                                        <f:else>
                                            <span class="badge badge-{label.class}" title="{label.description}">No upload</span>
                                        </f:else>
                                    </f:if>
                                </td>
										
                                <f:comment></f:comment>
                                <td class="nowrap">

                                    <f:comment></f:comment>
                                    <div class="btn-group" role="group">

                                        <f:comment>Edit</f:comment>
                                        <f:link.action
                                            action="edit"
                                            controller="Extension"
                                            arguments="{
                                                'vendorName': extensionData.extension.vendorName,
                                                'extensionName': extensionData.extension.extensionName
                                            }"
                                            class="btn btn-default"
                                            data="{bs-toggle: 'tooltip'}"
                                            title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:editextension')}"
                                        >
                                            <core:icon identifier="actions-open" />
                                        </f:link.action>

                                        <f:comment>Duplicate</f:comment>

                                        <f:comment>Rename</f:comment>

                                        <f:comment>Delete</f:comment>
                                        <f:if condition="{extensionData.extension.noDelete} != true">
                                            <f:link.action
                                                action="delete"
                                                controller="Extension"
                                                arguments="{
                                                    'vendorName': extensionData.extension.vendorName,
                                                    'extensionName': extensionData.extension.extensionName
                                                }"
                                                class="btn btn-default"
                                                additionalAttributes="{disabled:'disabled'}"
                                                class="btn btn-default t3js-modal-trigger"
                                                data="{
                                                    bs-toggle: 'tooltip',
                                                    severity: 'warning',
                                                    button-close-text: '{f:translate(key: \'{lllBase}.xlf:cancel\')}',
                                                    bs-content='{f:translate(key: \'{lllBase}.xlf:msg.delete\')}'
                                                }"
                                                title="{f:translate(key:'{lllBase}.xlf:delete')}"
                                            >
                                                <core:icon identifier="actions-edit-delete" />
                                            </f:link.action>
                                        </f:if>
                                    </div>

                                    <f:comment>Build</f:comment>
                                    <f:if condition="{extensionData.extension.noBuild} != true">
                                        <div class="btn-group" role="group">
                                            <f:link.action
                                                action="listbuild"
                                                controller="Extension"
                                                arguments="{
                                                    'vendorName': extensionData.extension.vendorName,
                                                    'extensionName': extensionData.extension.extensionName
                                                }"
                                                class="btn btn-default"
                                                data="{bs-toggle: 'tooltip'}"
                                                title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:build')}"
                                            >
                                                <core:icon identifier="actions-play" />
                                            </f:link.action>
                                        </div>
                                    </f:if>


                                    <f:comment>ExtensionInfo</f:comment>

                                        <div class="btn-group" role="group">
                                            <f:link.action
                                                action="info"
                                                controller="Extensioninfo"
                                                arguments="{
                                                    'vendorName': extensionData.extension.vendorName,
                                                    'extensionName': extensionData.extension.extensionName
                                                }"
                                                class="btn btn-default"
                                                data="{bs-toggle: 'tooltip'}"
                                                title="ExtensionInfo"
                                            >
                                                <core:icon identifier="actions-document-view" />
                                            </f:link.action>
                                        </div>


<f:comment>
                                    <f:comment>Upload</f:comment>
                                    <f:if condition="{extensionData.extension.noUpload} != true">
                                        <div class="btn-group" role="group">
                                            <f:link.action
                                                action="upload"
                                                controller="Extension"
                                                arguments="{
                                                    'vendorName': extensionData.extension.vendorName,
                                                    'extensionName': extensionData.extension.extensionName
                                                }"
                                                class="btn btn-default"
                                                data="{bs-toggle: 'tooltip'}"
                                                title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:upload')}"
                                            >
                                                <core:icon identifier="actions-database-import" />
                                            </f:link.action>
                                        </div>
                                    </f:if>
</f:comment>
                                </td>
                            </tr>
                        </f:for>

                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>
