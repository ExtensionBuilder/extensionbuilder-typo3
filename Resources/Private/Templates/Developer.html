<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />

    <f:section name="Content">
        <f:form
            action="save"
            controller="Developer"
            id="developer-form"
        >
            <div class="wrapper">
                <h1>
                    <f:translate key="{lllBase}.developer.xlf:developerSettings" />
                </h1>
            </div>

            <f:render
                partial="BuildFields"
                arguments="{
                    lllBase: '{lllBase}',
                    fields: '{developerConfiguration.fieldsEdit}',
                    fieldsTabs: '{developerConfiguration.fieldsEditTabs}',
                    fieldsData: '{developerData}',
                    fieldsDataName: 'developer',
                    selectFields: '{selectFields}'
                }"
            />
        </f:form>
    </f:section>
</html>
