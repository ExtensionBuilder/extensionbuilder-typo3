<f:if condition="{project.dependencies}">
    <div class="tx_t3_extensionbulder_module_table">
        <div class="panel panel-default overflow-visible">
            <div>
                <div class="table-fit mb-0">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr class="taskGroup_{vendorGroupId}">
                                <th>
                                    <f:translate
key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.project.xlf:projectExtensionsDependencies"
                                    />
                                    ({project.dependencies -> f:count()})
                                </th>
                                <th data-sort-method="none"></th>                     
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{project.dependencies}" as="dependencieData">
                                <tr>
                                    <td class="nowrap-disabled">
                                        <div class="name">
                                            <strong>
                                                {dependencieData.extensionName} 
                                                <f:if condition="{dependencieData.extension.title} != ''">
                                                    ({dependencieData.extension.title})
                                                </f:if>
                                            </strong>
                                        </div>
                                        <f:if condition="{projectData.extension.description} != ''">
                                            <div class="text-muted" style="margin-top: 0.5em;">
                                                <f:format.nl2br>{dependencieData.extension.description}</f:format.nl2br>
                                            </div>
                                        </f:if>
                                    </td>
                                    <td class="nowrap"></td>										
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</f:if>
