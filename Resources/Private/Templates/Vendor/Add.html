<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />

    <f:section name="Content">

        <f:comment>DevelopmentCodeStart</f:comment>
        <f:if condition="{configuration.developmentServer}">
            <f:if condition="{configuration.debug.vendor.add.fluid}">
                <f:debug inline="1">{_all}</f:debug>
            </f:if>
        </f:if>
        <f:comment>DevelopmentCodeEnd</f:comment>

        <h1>
            <f:translate
                key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.vendor.xlf:add"
            />
        </h1>

        <form name="tx_extensionbuilder_form" id="tx_extensionbuilder_form" method="post">
            <div class="tx_extensionbuilder_module">

                <div class="form-section">
                    <f:render partial="Vendor/Fields/VendorName" arguments="{vendorData: vendorData}" />
                    <f:render partial="Vendor/Fields/Company" arguments="{vendorData: vendorData}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/Fields/Description" arguments="{vendorData: vendorData}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/Fields/Address" arguments="{vendorData: vendorData}" />
                    <f:render partial="Vendor/Fields/Postalcode" arguments="{vendorData: vendorData}" />
                    <f:render partial="Vendor/Fields/City" arguments="{vendorData: vendorData}" />
                    <f:render partial="Vendor/Fields/Country" arguments="{vendorData: vendorData}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/Fields/Homepage" arguments="{vendorData: vendorData}" />
                </div>

            </div>
        </form>

    </f:section>
</html>
