<f:for each="{vendors}" as="vendorAs">
    <f:render
        partial="ExtensionList"
        arguments="{
            lllBase: lllBase,
            extensions: vendorAs.extensions,
            vendorName: vendorAs.vendorName,
            headline: 'Vendor:',
            headlineData: vendorAs.vendorName,
            groupId: vendorAs.vendorName,
            collapsed: true
        }"
    />
</f:for>
