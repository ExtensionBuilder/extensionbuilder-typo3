<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />

    <f:section name="Content">
        <f:form
            action="save"
            controller="Configuration"
            id="configuration-form"
        >
            <div class="wrapper">
                <h1>
                    <f:translate key="{lllBase}.configuration.xlf:extensionBuilderSettings" />
                </h1>
            </div>

            <f:render
                partial="BuildFields"
                arguments="{
                    lllBase: lllBase,
                    fields: configurationConfiguration.fieldsEdit,
                    fieldsTabs: configurationConfiguration.fieldsEditTabs,
                    fieldsData: configurationData,
                    fieldsDataName: 'configuration'
                }"
            />
		</f:form>
    </f:section>
</html>
