<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />
    <f:section name="Content">

        <f:form
            action="save"
            controller="Vendor"
            id="vendor-edit-form"
        >
            <h1>
                <f:translate
                    key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.vendor.xlf:h1.edit"
                    arguments="{0: vendorData.vendorName}"
                />
            </h1>

            <div class="tx_extensionbuilder_module">

                <div class="form-section">
                    <f:render partial="Vendor/FieldsVendorName" arguments="{vendorData: vendorData}" />
                    <f:render partial="Vendor/FieldsCompany" arguments="{vendorData: vendorData}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/FieldsDescription" arguments="{vendorData: vendorData}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/FieldsAddress" arguments="{vendorData: vendorData}" />
                    <f:render partial="Vendor/FieldsPostalcode" arguments="{vendorData: vendorData}" />
                    <f:render partial="Vendor/FieldsCity" arguments="{vendorData: vendorData}" />
                    <f:render partial="Vendor/FieldsCountry" arguments="{vendorData: vendorData}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/FieldsHomepage" arguments="{vendorData: vendorData}" />
                </div>

            </div>
        </f:form>

    </f:section>
</html>
