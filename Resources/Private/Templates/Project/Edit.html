<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />

    <f:section name="Content">
        <f:form
            action="save"
            controller="Project"
            id="project-edit-form"
        >
            <div class="wrapper">
                <h1>
                    <f:translate
                        key="{lllBase}.project.xlf:h1.edit"
                        arguments="{0: project.name}"
                    />
                </h1>
			</div>

            <f:render
                partial="BuildFields"
                arguments="{
                    lllBase: '{lllBase}',
                    fields: '{projectConfiguration.fieldsEdit}',
                    fieldsTabs: '{projectConfiguration.fieldsEditTabs}',
                    fieldsData: '{projectData}',
                    fieldsDataName: 'project'
                }"
            />

            <div class="tx_extensionbuilder_module">
                <f:render partial="ProjectListExtesion" arguments="{_all}" />
            </div>

            <f:if  condition="{project.dependencies}">
                <div class="tx_extensionbuilder_module">
                    <f:render partial="ProjectListDependencies" arguments="{_all}" />
                </div>
            </f:if>

        </f:form>
    </f:section>
</html>
