<div class="tx_t3_extensionbulder_module_table">
    <div class="panel panel-default overflow-visible">
        <div>
            <div class="table-fit mb-0">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>
                                <f:translate
key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.project.xlf:projectExtensions"
                                />
                                ({project.extensions -> f:count()})

                                <f:be.link
                                    route="extensionbuilder_typo3.project.addextension"
                                    parameters="{
                                        projectKey: projectKey
                                    }"
                                    class="btn btn-default"
                                    title="Add Extension"
                                >
                                    Add
                                </f:be.link>
                            </th>
                            <th data-sort-method="none"></th>                     
                        </tr>
                    </thead>

                    <tbody data-multi-record-selection-row-selection="true">
                        <f:for each="{project.extensions}" as="projectData">
                            <tr>
                                <td class="nowrap-disabled">
                                    <div class="name">
                                        <strong>
                                            {projectData.extension.extensionName} 
                                            <f:if condition="{projectData.extension.title} != ''">
                                                ({projectData.extension.title})
                                            </f:if>
                                        </strong>
                                    </div>
                                    <f:if condition="{projectData.extension.description} != ''">
                                        <div class="text-muted" style="margin-top: 0.5em;">
                                            <f:format.nl2br>{projectData.extension.description}</f:format.nl2br>
                                        </div>
                                    </f:if>
                                </td>
                                <td class="nowrap">
                                    <div class="btn-group" role="group">
                                        <f:if condition="{projectData.extensionOnOff}">
                                            <f:then>
                                                <f:be.link
                                                    route="extensionbuilder_typo3.project.edit"
                                                    parameters="{
                                                        action: 'extensionOff',
                                                        projectKey: projectKey,
                                                        extensionName: projectData.extension.extensionName
                                                    }"
                                                    class="btn btn-default"
                                                    data="{bs-toggle: 'tooltip'}"
                                                    title=
"{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:editextension')}"
                                                >
                                                    <core:icon identifier="actions-edit-hide"/>
                                                </f:be.link>
                                            </f:then>
                                            <f:else>
                                                <f:be.link
                                                    route="extensionbuilder_typo3.project.edit"
                                                    parameters="{
                                                        action: 'extensionOn',
                                                        projectKey: projectKey,
                                                        extensionName: projectData.extension.extensionName
                                                    }"
                                                    class="btn btn-default"
                                                    data="{bs-toggle: 'tooltip'}"
                                                    title=
"{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:editextension')}"
                                                >
                                                    <core:icon identifier="actions-edit-unhide"/>
                                                </f:be.link>
                                            </f:else>
                                        </f:if>
                                        <f:be.link
                                            route="extensionbuilder_typo3.project.deleteextension"
                                            parameters="{
                                                projectKey: projectKey,
                                                extensionName: projectData.extension.extensionName,
                                            }"
                                            class="btn btn-default t3js-modal-trigger"
                                            data="{
                                                bs-toggle: 'tooltip',
                                                severity: 'warning',
                                                button-close-text: '{f:translate(key: \'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:cancel\')}',
                                                bs-content='{f:translate(key: \'LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/Language/locallang.xlf:msg.delete\')}'
                                            }"
                                            title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:delete')}"
                                        >
                                            <core:icon identifier="actions-edit-delete"/>
                                        </f:be.link>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
