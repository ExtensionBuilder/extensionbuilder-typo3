<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />
    <f:section name="Content">

        <f:form
            action="save"
            controller="Vendor"
            id="vendor-duplicate-form"
        >
            <h1>
                <f:translate
                    key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.vendor.xlf:duplicate"
                    arguments="{0: vendorData.vendorName}"
                />
            </h1>

            <div class="tx_extensionbuilder_module">
                <f:render partial="Vendor/Fields/VendorName" arguments="{_all}" />
            </div>
        </f:form>

    </f:section>
</html>
