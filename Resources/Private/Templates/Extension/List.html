<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />
    <f:section name="Content">

<p><b>
This is the first release candidate.<br />
Some features are currently disabled.<br />
They will be added gradually in the near future.<br />
<br />
Found a bug? Let us know via GitHub Issues.<br />
</b></p>

        <h1><f:translate key="{lllBase}.extension.xlf:h1.list" /></h1>

        <f:if condition="{project -> f:count()}">
            <f:render partial="Extension/ListProject" arguments="{_all}" />
        </f:if>

        <f:if condition="{currentVendor} == 'all'">
            <f:then>
                <f:render partial="Extension/ListShowAllVendor" arguments="{_all}" />
            </f:then>
            <f:else>
                <f:if condition="{currentVendor} != 'no'">
                    <f:render partial="Extension/ListShowOneVendor" arguments="{_all}" />
                </f:if>
            </f:else>
        </f:if>

    </f:section>
</html>
