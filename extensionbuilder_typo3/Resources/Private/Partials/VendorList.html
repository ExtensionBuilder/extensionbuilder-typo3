<div class="table-fit">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>
                    <f:translate key="{lllBase}.vendor.xlf:vendorList" />
                    ({vendorList -> f:count()})
                </th>
                <th>
                    <f:translate key="{lllBase}.xlf:company" />
                </th>
                <th>
                    <f:translate key="{lllBase}.xlf:description" />
                </th>
                <th data-sort-method="none"></th>
            </tr>
        </thead>

        <tbody>
            <f:for
                each="{vendorList}"
                as="vendor"
            >
                <tr class="{vendor.vendorName}" data-id="{vendor.vendorName}" >
                    <td class="nowrap-disabled">
                        <div class="name">
                            <f:link.action
                                action="edit"
                                controller="Vendor"
                                arguments="{'vendorName': vendor.vendorName}"
                            >
                                <strong>{vendor.vendorName}</strong>
                            </f:link.action>
                        </div>
                    </td>

                    <td class="nowrap-disabled">
                        <div class="text-muted eb-margin-top-half">
                            <f:format.nl2br>{vendor.company}</f:format.nl2br>
                        </div>
                    </td>

                    <td class="nowrap-disabled">
                        <div class="text-muted eb-margin-top-half">
                            <f:format.nl2br>{vendor.description}</f:format.nl2br>
                        </div>
                    </td>

                    <f:comment>Control</f:comment>
                    <td class="col-control align-top">
                        <div class="btn-group" role="group">
                            <f:comment>Edit</f:comment>
                            <f:link.action
                                action="edit"
                                controller="Vendor"
                                arguments="{'vendorName': vendor.vendorName}"
                                class="btn btn-default"
                                data="{bs-toggle: 'tooltip'}"
                                title="{f:translate(key:'{lllBase}.xlf:edit')}"
                            >
                                <core:icon identifier="actions-open" />
                            </f:link.action>

                        </div>

                        <div class="btn-group">
                            <f:comment>Delete</f:comment>
                            <f:link.action
                                action="delete"
                                controller="Vendor"
                                arguments="{'vendorName': vendor.vendorName}"
                                class="btn btn-default t3js-modal-trigger"
                                data="{
                                    bs-toggle: 'tooltip',
                                    severity: 'warning',
                                    button-close-text: '{f:translate(key: \'{lllBase}.xlf:cancel\')}',
                                    bs-content='{f:translate(key: \'{lllBase}.xlf:msg.delete\')}'
                                }"
                                title="{f:translate(key:'{lllBase}.xlf:delete')}"
                            >
                                <core:icon identifier="actions-edit-delete" />
                            </f:link.action>
                        </div>
                    </td>
                </tr>
            </f:for>
        </tbody>
    </table>
</div>
