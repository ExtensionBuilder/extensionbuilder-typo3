<f:comment>ToDo</f:comment>

<div class="tx_extensionbuilder_typo3_module_table">
    <div class="panel panel-default overflow-visible">

        <div>
            <div class="table-fit mb-0">

                <table class="table table-striped table-hover Group-table">
                    <thead>
                        <tr>
                            <th>
                                <span class="btn fw-bold pt-1 p-0">
                                        {f:translate(
                                            key: '{lllBase}.project.xlf:list'
                                        )}
                                        ({projects -> f:count()})
                                </span>
                            </th>
                            <th>
                                <f:translate key="{lllBase}.xlf:label.info" />
                            </th>

                            <th data-sort-method="none"></th>
                        </tr>
                    </thead>

                    <tbody>
                        <f:for each="{projects}" key="projectKey" as="projectData">
                            <tr>

                                <f:comment>Name</f:comment>
                                <td class="nowrap-disabled">
                                    <div class="name">
                                        <f:link.action
                                            action="edit"
                                            controller="Project"
                                            arguments="{'projectKey': projectKey}"
                                        >
                                            <strong>{projectData.name}</strong>
                                        </f:link.action>
                                    </div>
                                </td>

                                <f:comment>Description</f:comment>
                                <td class="nowrap-disabled">
                                    <strong>
                                        {projectData.description -> f:format.crop(maxCharacters: 50)}
                                    </strong>
                                </td>

                                <f:comment>Edit block</f:comment>
                                <td class="nowrap">
                                    <div class="btn-group" role="group">

										<f:comment>Edit</f:comment>
                                        <f:link.action
                                            action="edit"
                                            controller="Project"
                                            arguments="{'projectKey': projectKey}"
                                            class="btn btn-default"
                                            data="{bs-toggle: 'tooltip'}"
                                            title="{f:translate(key:'{lllBase}.xlf:edit')}"
                                        >
                                            <core:icon identifier="actions-open" />
                                        </f:link.action>

                                        <f:comment>Duplicate</f:comment>

                                        <f:comment>Rename</f:comment>

                                        <f:comment>Delete</f:comment>
                                        <f:link.action
                                            action="delete"
                                            controller="Project"
                                            arguments="{'projectKey': projectKey}"
                                            class="btn btn-default t3js-modal-trigger"
                                            data="{
                                                bs-toggle: 'tooltip',
                                                severity: 'warning',
                                                button-close-text: '{f:translate(key: \'{lllBase}.xlf:cancel\')}',
                                                bs-content='{f:translate(key: \'{lllBase}.xlf:msg.delete\')}'
                                            }"
                                            title="{f:translate(key:'{lllBase}.xlf:delete')}"
                                        >
                                            <core:icon identifier="actions-edit-delete" />
                                        </f:link.action>

                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
