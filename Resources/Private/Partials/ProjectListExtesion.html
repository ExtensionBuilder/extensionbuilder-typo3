
            <div class="table-fit mb-0">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>
                                <f:translate key="{lllBase}.project.xlf:projectExtensions" />
                                ({project.extensions -> f:count()})
                                <f:link.action
                                    action="addExtension"
                                    controller="Project"
                                    arguments="{'projectKey': projectKey}"
                                    class="btn btn-default"
                                    title="Add Extension"
                                >
                                    Add
                                </f:link.action>
                            </th>
                            <th data-sort-method="none"></th>                     
                        </tr>
                    </thead>

                    <tbody data-multi-record-selection-row-selection="true">
                        <f:for
                            each="{project.extensions}"
                            as="projectAs"
                        >
                            <tr>
                                <td class="nowrap-disabled">
                                    <div class="name">
                                        <strong>
                                            {projectAs.extension.extensionNamespace} 
                                            <f:if condition="{projectAs.extension.title} != ''">
                                                ({projectAs.extension.title})
                                            </f:if>
                                        </strong>
                                    </div>
                                    <f:if condition="{projectAs.extension.description} != ''">
                                        <div class="text-muted eb-margin-top-half">
                                            <f:format.nl2br>{projectAs.extension.description}</f:format.nl2br>
                                        </div>
                                    </f:if>
                                </td>

                                <f:comment>Control block</f:comment>
                                <td class="col-control align-top">
                                    <div class="btn-group" role="group">
                                        <f:link.action
                                            action="deleteExtension"
                                            controller="Project"
                                            arguments="{
                                                'projectKey': projectKey,
                                                'extensionName': projectAs.extension.extensionNamespace
                                            }"
                                            class="btn btn-default t3js-modal-trigger"
                                            data="{
                                                bs-toggle: 'tooltip',
                                                severity: 'warning',
                                                button-close-text: '{f:translate(key: \'{lllBase}.xlf:cancel\')}',
                                                bs-content='{f:translate(key: \'{lllBase}.xlf:msg.delete\')}'
                                            }"
                                            title="{f:translate(key:'{lllBase}.xlf:delete')}"
                                        >
                                            <core:icon identifier="actions-edit-delete" />
                                        </f:link.action>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
