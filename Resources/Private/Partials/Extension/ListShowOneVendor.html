<f:comment>ToDo</f:comment>

<f:for each="{vendors}" as="vendorAs" key="vendorKey">
    <f:if condition="{currentVendor} == {vendorKey}">
        <f:render
            partial="Extension/List"
            arguments="{
                lllBase: lllBase,
                extensions: vendorAs.extensions,
                vendorName: vendorAs.vendorName,
                groupId: vendorAs.vendorName,
                collapsed: false
            }"
        />
    </f:if>
</f:for>
