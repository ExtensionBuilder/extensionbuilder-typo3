<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />
    <f:section name="Content">

    	<f:if condition="{vendorList -> f:count()} == 0">
        	<f:then>
                <h1>
                    <f:translate key="{lllBase}.vendor.xlf:startNow" />
                </h1>
        	</f:then>
        	<f:else>
                <h1>
                    <f:translate key="{lllBase}.vendor.xlf:h1.list" />
                </h1>
    			<f:render partial="Vendor/List" arguments="{_all}" />
        	</f:else>
    	</f:if>	

    </f:section>
</html>
