services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  ExtensionBuilder\ExtensionbuilderTypo3\:
    resource: '../Classes/*'
    exclude: ['../Classes/ExtensionBuilder/*']


  extension.remote.myremote:
    class: 'TYPO3\CMS\Extensionmanager\Remote\TerExtensionRemote'
    arguments:
      $identifier: 'extension-builder'
      $options:
         remoteBase: 'https://typo3.extension-builder.dev//'
    tags:
      - name: 'extension.remote'
        default: true
