<div class="tx_extensionbuilder_mod1_extension">
    <div class="panel panel-default overflow-visible">

        <div class="panel-heading" data-extension-group-id="{vendorGroupId}">
            <button
                type="button"
                title="{f:translate(key: '{lllBase}.extensions.xlf:label.extensionconfiguration')}"
                class="btn btn-link fw-bold pt-1 p-0"
                data-bs-toggle="collapse"
                data-bs-target="#extensionbuilder-extension-group"
                aria-expanded="{f:if(condition: extensionGroup.backendGroupCollapsed, then: 'false', else: 'true')}"
            >
                <span>
                    <f:translate 
                        key="{lllBase}.extension.xlf:label.extensionconfiguration"
                    />
                </span>
            </button>

            <button
                type="button"
                class="btn btn-default btn-sm float-end t3js-toggle-table"
                data-bs-toggle="collapse"
                data-bs-target="#extensionbuilder-extension-group"
                aria-expanded="{f:if(condition: extensionGroup.backendGroupCollapsed, then: 'false', else: 'true')}"
            >
                <span class="collapseIcon">
                    <core:icon
                        identifier="{f:if(condition: extensionGroup.backendGroupCollapsed, then: 'actions-view-list-expand', else: 'actions-view-list-collapse')}"
                        size="small"
                    />
                </span>
            </button>
        </div>

        <div
            class="panel-collapse collapse {f:if(condition: '{extensionGroup.backendGroupCollapsed}', then: 'show')}"
            id="extensionbuilder-extension-group"
            data-table="extensionbuilder-extension-group"
        >
            <div class="form-section">
                <f:render 
                    partial="Extension/Fields/VendorGroup"
                    arguments="{
                        lllBase: lllBase, 
                        extensionData: extensionData,
                        registeredVendorGroups: registeredVendorGroups
                    }"
                />
            </div>

            <div class="form-section">
                <div id="extensionbuilder-extension-name">
                    <f:render partial="Extension/Fields/Name" arguments="{lllBase: lllBase, extensionData: extensionData}" />
                    <f:render partial="Extension/Fields/NamePrefix" arguments="{lllBase: lllBase, extensionData: extensionData}" />
                </div>

                <div id="extensionbuilder-extension-name">
                    <f:render partial="Extension/Fields/ComposerName" arguments="{lllBase: lllBase, extensionData: extensionData}" />
                    <f:render partial="Extension/Fields/TerName" arguments="{lllBase: lllBase, extensionData: extensionData}" />
                </div>
            </div>

            <div class="form-section">
                <f:render partial="Extension/Fields/Title" arguments="{lllBase: lllBase, extensionData: extensionData}" />
                <f:render partial="Extension/Fields/Description" arguments="{lllBase: lllBase, extensionData: extensionData}" />
            </div>

            <div class="form-section">
                <f:render partial="Extension/Fields/Version" arguments="{lllBase: lllBase, extensionData: extensionData}" />
            </div>

        </div>
    </div>
</div>
