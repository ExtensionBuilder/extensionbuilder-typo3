<div class="tx_t3_extensionbulder_module_table">
    <div class="panel panel-default overflow-visible">
        <div>
            <div class="table-fit mb-0">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>
                                <f:translate key="{lllBase}.project.xlf:projectExtensions" />
                                ({extensions -> f:count()})

                            </th>
                            <th data-sort-method="none"></th>                     
                        </tr>
                    </thead>

                    <tbody data-multi-record-selection-row-selection="true">
                        <f:for each="{extensions}" as="extensionAs">
                            <tr>
                                <td class="nowrap-disabled">
                                    <div class="name">

                                        <f:link.action
                                            action="addextension"
                                            controller="Project"
                                            arguments="{
                                                'cmd': 'save',
                                                'projectKey': projectKey,
                                                'extensionName': extensionAs.extensionName
                                            }"
                                        >
                                            <strong>
                                                {extensionAs.vendorName} / {extensionAs.extensionName}
                                                <f:if condition="{extensionAs.title} != ''">
                                                    ({extensionAs.title})
                                                </f:if>
                                            </strong>
                                            <f:if condition="{extensionAs.extension.description} != ''">
                                                <div class="text-muted" style="margin-top: 0.5em;">
                                                    <f:format.nl2br>{extensionAs.description}</f:format.nl2br>
                                                </div>
                                            </f:if>
                                        </f:link.action>
                                    </div>
                                </td>
                                <td class="nowrap">
                                    <div class="btn-group" role="group">
                                        <f:link.action
                                            action="addextension"
                                            controller="Project"
                                            arguments="{
                                                'cmd': 'save',
                                                'projectKey': projectKey,
                                                'extensionName': extensionAs.extensionName

                                            }"
                                            class="btn btn-default"
                                            data="{bs-toggle: 'tooltip'}"
                                            title=
"{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:editextension')}"
                                        >
                                            <core:icon identifier="actions-extension-add" />
                                        </f:link.action>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
