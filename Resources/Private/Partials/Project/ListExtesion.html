<f:comment>ToDo</f:comment>

<div class="tx_t3_extensionbulder_module_table">
    <div class="panel panel-default overflow-visible">
        <div>
            <div class="table-fit mb-0">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>
                                <f:translate key="{lllBase}.project.xlf:projectExtensions" />
                                ({project.extensions -> f:count()})
                                <f:link.action
                                    action="addextension"
                                    controller="Project"
                                    arguments="{'projectKey': projectKey}"
                                    class="btn btn-default"
                                    title="Add Extension"
                                >
                                    Add
                                </f:link.action>
                            </th>
                            <th data-sort-method="none"></th>                     
                        </tr>
                    </thead>

                    <tbody data-multi-record-selection-row-selection="true">
                        <f:for each="{project.extensions}" as="projectAs">

							
                            <tr>
                                <td class="nowrap-disabled">
                                    <div class="name">
                                        <strong>
                                            {projectAs.extension.extensionName} 
                                            <f:if condition="{projectAs.extension.title} != ''">
                                                ({projectAs.extension.title})
                                            </f:if>
                                        </strong>
                                    </div>
                                    <f:if condition="{projectAs.extension.description} != ''">
                                        <div class="text-muted" style="margin-top: 0.5em;">
                                            <f:format.nl2br>{projectAs.extension.description}</f:format.nl2br>
                                        </div>
                                    </f:if>
                                </td>
                                <td class="nowrap">

                                    <div class="btn-group" role="group">
<f:comment>
                                        <f:if condition="{projectData.extensionOnOff}">
                                            <f:then>
                                                <f:be.link
                                                    route="extensionbuilder_typo3.project.edit"
                                                    parameters="{
                                                        action: 'extensionOff',
                                                        projectKey: projectKey,
                                                        extensionName: projectAs.extension.extensionName
                                                    }"
                                                    class="btn btn-default"
                                                    data="{bs-toggle: 'tooltip'}"
                                                    title=
"{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:editextension')}"
                                                >
                                                    <core:icon identifier="actions-edit-hide" />
                                                </f:be.link>

                                            </f:then>
                                            <f:else>

                                                <f:be.link
                                                    route="extensionbuilder_typo3.project.edit"
                                                    parameters="{
                                                        action: 'extensionOn',
                                                        projectKey: projectKey,
                                                        extensionName: projectAs.extension.extensionName
                                                    }"
                                                    class="btn btn-default"
                                                    data="{bs-toggle: 'tooltip'}"
                                                    title=
"{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:editextension')}"
                                                >
                                                    <core:icon identifier="actions-edit-unhide" />
                                                </f:be.link>
                                            </f:else>
                                        </f:if>
</f:comment>
                                        <f:link.action
                                            action="deleteextension"
                                            controller="Project"
                                            arguments="{
                                                'projectKey': projectKey,
                                                'extensionName': projectAs.extension.extensionName
                                            }"
                                            class="btn btn-default t3js-modal-trigger"
                                            data="{
                                                bs-toggle: 'tooltip',
                                                severity: 'warning',
                                                button-close-text: '{f:translate(key: \'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:cancel\')}',
                                                bs-content='{f:translate(key: \'{lllBase}.xlf:msg.delete\')}'
                                            }"
                                            title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:delete')}"
                                        >
                                            <core:icon identifier="actions-edit-delete" />
                                        </f:link.action>
                                    </div>

                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
