<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Module" />
    <f:section name="Content">

        <f:form
            action="save"
            controller="Vendor"
            id="vendor-add-form"
        >
            <h1><f:translate key="{lllBase}.vendor.xlf:h1.add" /></h1>

            <div class="tx_extensionbuilder_module">

                <div class="form-section">
                    <f:render partial="Vendor/FieldsVendorName" arguments="{lllBase: '{lllBase}', vendorData: '{vendorData}'}" />
                    <f:render partial="Vendor/FieldsCompany" arguments="{lllBase: '{lllBase}', vendorData: '{vendorData}'}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/FieldsDescription" arguments="{lllBase: '{lllBase}', vendorData: '{vendorData}'}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/FieldsAddress" arguments="{lllBase: '{lllBase}', vendorData: '{vendorData}'}" />
                    <f:render partial="Vendor/FieldsPostalcode" arguments="{lllBase: '{lllBase}', vendorData: '{vendorData}'}" />
                    <f:render partial="Vendor/FieldsCity" arguments="{lllBase: '{lllBase}', vendorData: '{vendorData}'}" />
                    <f:render partial="Vendor/FieldsCountry" arguments="{lllBase: '{lllBase}', vendorData: '{vendorData}'}" />
                </div>

                <div class="form-section">
                    <f:render partial="Vendor/FieldsHomepage" arguments="{lllBase: '{lllBase}', vendorData: '{vendorData}'}" />
                </div>

                <f:render
                    partial="BuildFields"
                    arguments="{
                        lllBase: '{lllBase}',
                        componentData: '{componentData}',
                        fields: '{componentFields}',
                        fieldData: '{componentData}'
                    }"
                />

            </div>
        </f:form>

    </f:section>
</html>
