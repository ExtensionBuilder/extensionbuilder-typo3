<div class="table-fit mb-0">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>
                    <f:translate key="{lllBase}.project.xlf:projectExtensions" />
                    ({extensions -> f:count()})
                </th>
                <th data-sort-method="none"></th>                     
             </tr>
        </thead>

        <tbody data-multi-record-selection-row-selection="true">
            <f:for
                each="{extensions}"
                as="extensionAs"
            >
                <tr>
                    <td class="nowrap-disabled">
                        <div class="name">
                            <f:link.action
                                action="addextension"
                                controller="Project"
                                arguments="{
                                    'cmd': 'save',
                                    'projectKey': projectKey,
                                    'extensionName': extensionAs.extensionNamespace
                                }"
                            >
                                <strong>
                                    {extensionAs.vendorName} / {extensionAs.extensionNamespace}
                                    <f:if condition="{extensionAs.title} != ''">
                                        ({extensionAs.title})
                                    </f:if>
                                </strong>
                                <f:if condition="{extensionAs.extension.description} != ''">
                                    <div class="text-muted eb-margin-top-half">
                                        <f:format.nl2br>{extensionAs.description}</f:format.nl2br>
                                    </div>
                                </f:if>
                            </f:link.action>
                        </div>
                    </td>

                    <f:comment>Control block</f:comment>
                    <td class="col-control align-top">
                        <div class="btn-group" role="group">
                            <f:link.action
                                action="addExtension"
                                controller="Project"
                                arguments="{
                                    'cmd': 'save',
                                    'projectKey': projectKey,
                                    'extensionName': extensionAs.extensionNamespace
                                }"
                                class="btn btn-default"
                                data="{bs-toggle: 'tooltip'}"
                                title="{f:translate(key:'{lllBase}.project.xlf::addextension')}"
                            >
                                <core:icon identifier="actions-extension-add" />
                            </f:link.action>
                        </div>
                    </td>
                </tr>
            </f:for>
        </tbody>
    </table>
</div>
