<div class="tx_extensionbuilder_typo3_module_vendor">
    <div class="panel panel-default overflow-visible">

<f:comment>
            <div class="panel-heading" >
                <span class="btn fw-bold pt-1 p-0">
                    {f:translate(key: 'LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.vendor.xlf:h1')}
                </span>
            </div>
</f:comment>

        <div class="panel-collapse collapse {f:if(condition: '!{vendorGroup.backendVendorGroupCollapsed}', then: 'show')}">
            <div class="table-fit mb-0">
                <table class="table table-striped table-hover Group-table">

                    <thead>
                        <tr class="vendorGroup">
                            <th>
                                <f:translate
                                    key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.vendor.xlf:vendorList"
                                />
                                ({vendorList -> f:count()})
                            </th>
                            <th>
                                <f:translate
                                    key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.xlf:company"
                                />
                            </th>
                            <th>
                                <f:translate
                                    key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.xlf:description"
                                />
                            </th>
                            <th data-sort-method="none"></th>
                        </tr>
                    </thead>

                    <tbody>
                        <f:for each="{vendorList}" as="vendor">
                            <tr class="{vendor.vendorName}" data-task-id="{vendor.vendorName}">

                                <td class="nowrap-disabled">
                                    <div class="name">
                                        <f:be.link
                                            route="extensionbuilder_typo3.vendor.edit"
                                            parameters="{'vendorName': vendor.vendorName}"
                                        >
                                            <strong>{vendor.vendorName}</strong>
                                        </f:be.link>
                                    </div>
                                </td>

                                <td class="nowrap-disabled">
                                    <div class="text-muted" style="margin-top: 0.5em;">
                                        <f:format.nl2br>{vendor.company}</f:format.nl2br>
                                    </div>
                                </td>

                                <td class="nowrap-disabled">
                                    <div class="text-muted" style="margin-top: 0.5em;">
                                        <f:format.nl2br>{vendor.description}</f:format.nl2br>
                                    </div>
                                </td>

                                <td class="nowrap">
                                    <div class="btn-group" role="group">

                                        <f:comment>Edit</f:comment>
                                        <f:be.link
                                            route="extensionbuilder_typo3.vendor.edit"
                                            parameters="{vendorName: vendor.vendorName}"
                                            class="btn btn-default"
                                            data="{bs-toggle: 'tooltip'}"
                                            title="{f:translate(key:'LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.xlf:edit')}"
                                        >
                                            <core:icon identifier="actions-open"/>
                                        </f:be.link>

                                        <f:comment>Duplicate</f:comment>
                                        <f:be.link
                                            route="extensionbuilder_typo3.vendor.duplicate"
                                            parameters="{vendorName: vendor.vendorName}"
                                            class="btn btn-default"
                                            data="{bs-toggle: 'tooltip'}"
                                            title="{f:translate(key:'LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.xlf:duplicate')}"
                                        >
                                            <core:icon identifier="actions-duplicate"/>
                                        </f:be.link>

                                        <f:comment>Rename</f:comment>
                                        <f:be.link
                                            route="extensionbuilder_typo3.vendor.rename"
                                            parameters="{vendorName: vendor.vendorName}"
                                            class="btn btn-default"
                                            data="{bs-toggle: 'tooltip'}"
                                            title="{f:translate(key:'LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.xlf:rename')}"
                                        >
                                            <core:icon identifier="actions-rename"/>
                                        </f:be.link>

                                        <f:comment>Delete</f:comment>
                                        <f:be.link
                                            route="extensionbuilder_typo3.vendor.delete"
                                            parameters="{vendorName: vendor.vendorName}"
                                            class="btn btn-default t3js-modal-trigger"
                                            data="{
                                                bs-toggle: 'tooltip',
                                                severity: 'warning',
                                                button-close-text: '{f:translate(key: \'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:cancel\')}',
                                                bs-content='{f:translate(key: \'LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/Language/locallang.xlf:msg.delete\')}'
                                            }"
                                            title="{f:translate(key:'LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.xlf:delete')}"
                                        >
                                            <core:icon identifier="actions-edit-delete"/>
                                        </f:be.link>

                                    </div>
                                </td>

                            </tr>
                        </f:for>

                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
