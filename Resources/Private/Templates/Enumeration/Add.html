a<html

>

    <f:section name="Content">

    <f:be.pageRenderer
        includeJavaScriptModules="{
            0: '@typo3/backend/modal.js'
        }"
    />

        <h1>
            <f:translate key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.tables.xlf:edit.h1" />
        </h1>
<f:comment>
		<h2><f:translate key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.tables.xlf:edit.h2" /></h2>
		<p><f:translate key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.tables.xlf:edit.content" /></p>
</f:comment>


        <form name="tx_extensionbuilder_form" id="tx_extensionbuilder_form" method="post">

            <div class="tx_extensionbuilder_module">
                <div>
                    <f:render partial="Extension/Enumerations/EnumerationNameField" arguments="{enumerationName: enumerationName}"/>
                    <f:render partial="Extension/Enumerations/EnumerationDescriptionField" arguments="{enumerationData: enumerationData}"/>

            </div>
        </form>

    </f:section>
