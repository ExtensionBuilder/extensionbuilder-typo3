services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  ExtensionBuilder\ExtensionbuilderTypo3\:
    resource: '../Classes/*'
    exclude: ['../Classes/ExtensionBuilder/*','../Classes/Enumeration/*', '../Classes/Utility/*', '../Classes/Property/*']


  extension.remote.myremote:
    class: 'TYPO3\CMS\Extensionmanager\Remote\TerExtensionRemote'
    arguments:
      $identifier: 'myremote'
      $options:
         remoteBase: 'https://https://development.extension-builder.dev//'
    tags:
      - name: 'extension.remote'
        default: true


  ExtensionBuilder\ExtensionbuilderTypo3\Controller\ExtensionModuleController:
    tags: ['backend.controller']

  ExtensionBuilder\ExtensionbuilderTypo3\Controller\TableModuleController:
    tags: ['backend.controller']

  ExtensionBuilder\ExtensionbuilderTypo3\Controller\EnumerationModuleController:
    tags: ['backend.controller']

  ExtensionBuilder\ExtensionbuilderTypo3\Controller\EnumerationConstantModuleController:
    tags: ['backend.controller']

  ExtensionBuilder\ExtensionbuilderTypo3\Controller\LanguageModuleController:
    tags: ['backend.controller']


  ExtensionBuilder\ExtensionbuilderTypo3\Controller\ProjectModuleController:
    tags: ['backend.controller']

  ExtensionBuilder\ExtensionbuilderTypo3\Controller\VendorModuleController:
    tags: ['backend.controller']

  ExtensionBuilder\ExtensionbuilderTypo3\Controller\DeveloperModuleController:
    tags: ['backend.controller']

  ExtensionBuilder\ExtensionbuilderTypo3\Controller\ConfigurationModuleController:
    tags: ['backend.controller']

  ExtensionBuilder\ExtensionbuilderTypo3\Controller\InfoModuleController:
    tags: ['backend.controller']
