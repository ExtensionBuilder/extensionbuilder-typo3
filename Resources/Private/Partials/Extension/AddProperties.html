<div class="tx_extensionbuilder_mod1_configuration">
    <div class="panel panel-default overflow-visible">

        <div class="btn-toolbar panel-heading">

            <f:alias
                map="{add: {
                    table: 'Table',
                    enumeration: 'Enumeration'
                }}"
            >

<f:comment>
scheduler: 'Scheduler',
events: 'Events',
viewHelpers: 'ViewHelpers',
backend: 'Backend'
</f:comment>

                <f:for each="{add}" as="wert" key="key">
                    <f:be.link
                        route="extensionbuilder_typo3.{key}.add"
                        parameters="{
                            vendorName: vendorName,
                            extensionName: extensionName
                        }"
                        class="btn btn-default"
                        title="{wert}"
                    >
                        {wert}
                    </f:be.link>
                </f:for>
            </f:alias>

        </div>
    </div>
</div>
