<f:if condition="{currentProject} != 'no'">
    <h1>
        <f:translate
            key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.extensions.xlf:overviewOfProjectExtensions"
        />
    </h1>
    <f:render 
        partial="Extension/List"
        arguments="{
            extensions: project.extensions,
            headline: 'Current Project',
            name: currentProjects.name,
            groupId: 'extensions'
        }"
    />
    <f:if condition="{project.dependencies}">
        <f:render
            partial="Extension/List"
            arguments="{
                extensions: project.dependencies,
                extensionOnOff: true,
                headline: 'Project dependencies',
                name: currentProjects.name,
                groupId: 'dependencies',
                collapsed: true
            }"
        />
    </f:if>
</f:if>
