<div class="tx_t3_extensionbulder_module_table">
    <div class="panel panel-default overflow-visible">
        <div>
            <div class="table-fit mb-0">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>
                                <f:translate
key="LLL:EXT:extensionbuilder_typo3/Resources/Private/Language/locallang.project.xlf:projectExtensions"
                                />
                                ({extensions -> f:count()})

                            </th>
                            <th data-sort-method="none"></th>                     
                        </tr>
                    </thead>

                    <tbody data-multi-record-selection-row-selection="true">
                        <f:for each="{extensions}" as="extensionData">
                            <tr>
                                <td class="nowrap-disabled">
                                    <div class="name">

                                        <f:be.link
                                            route="extensionbuilder_typo3.project.addextension"
                                            parameters="{
                                                action: 'extensionAdd',
                                                projectKey: projectKey,
                                                extensionName: extensionData.extensionName
                                            }"
                                        >
                                            <strong>
                                                {extensionData.vendorName} / {extensionData.extensionName}
                                                <f:if condition="{extensionData.title} != ''">
                                                    ({extensionData.title})
                                                </f:if>
                                            </strong>
                                            <f:if condition="{extensionData.extension.description} != ''">
                                                <div class="text-muted" style="margin-top: 0.5em;">
                                                    <f:format.nl2br>{extensionData.description}</f:format.nl2br>
                                                </div>
                                            </f:if>
                                        </f:be.link>
                                    </div>
                                </td>
                                <td class="nowrap">
                                    <div class="btn-group" role="group">
                                        <f:be.link
                                            route="extensionbuilder_typo3.project.addextension"
                                            parameters="{
                                                action: 'extensionAdd',
                                                projectKey: projectKey,
                                                extensionName: extensionData.extensionName
                                            }"
                                            class="btn btn-default"
                                            data="{bs-toggle: 'tooltip'}"
                                            title=
"{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:editextension')}"
                                        >
                                            <core:icon identifier="actions-extension-add"/>
                                        </f:be.link>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
